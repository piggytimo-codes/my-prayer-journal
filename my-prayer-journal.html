<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prayer Journal</title>
    <!-- Chosen Palette: Serene Dawn (Warm off-white, gentle gray, soft sage green, dusty rose accents) -->
    <!-- Application Structure Plan: A single-page application (SPA) with a clean, two-section layout. The main view displays a form to add new prayers and a list of "Open" prayers. A prominent toggle allows the user to switch to an "Answered" prayers view. User authentication is handled via modals to keep the main interface uncluttered. This structure was chosen for its simplicity and focus, allowing the user to concentrate on the act of prayer and reflection without navigational complexity. The real-time nature of Firebase ensures the lists are always current, providing a seamless user experience. -->
    <!-- Visualization & Content Choices: The primary "visualizations" are the dynamic lists of prayers. Report Info: Prayer text, timestamp, status. -> Goal: Organize & Reflect. -> Presentation: Two distinct, filterable lists (Open/Answered). -> Interaction: Users can add new prayers via a form, and mark prayers as answered with a single click on a checkmark icon. -> Justification: This direct manipulation is intuitive and provides immediate feedback. The separation of open and answered prayers helps the user focus on current needs while also providing a space for gratitude and review. -> Library/Method: Vanilla JavaScript for DOM manipulation, Firebase Firestore for real-time data storage and retrieval. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F7F4;
            color: #4a4a4a;
        }
        h1, h2, h3 {
            font-family: 'Lora', serif;
        }
        .prayer-card {
            transition: all 0.3s ease-in-out;
            opacity: 1;
        }
        .prayer-card.removing {
            opacity: 0;
            transform: scale(0.95);
        }
        .form-glow {
            box-shadow: 0 0 15px 5px rgba(135, 152, 134, 0.2);
            transition: box-shadow 0.3s ease-in-out;
        }
        .btn-primary {
            background-color: #879886; /* Soft Sage Green */
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: #70816f;
        }
        .btn-secondary {
            background-color: #EAE8E1; /* Gentle Gray */
            color: #4a4a4a;
        }
        .btn-secondary:hover {
            background-color: #dcd9d0;
        }
        .nav-tab {
            color: #4a4a4a;
            border-bottom-color: transparent;
        }
        .nav-tab.active {
            font-weight: bold;
            color: #879886;
            border-bottom-color: #879886;
        }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
        .checkmark {
            color: #dcd9d0;
            cursor: pointer;
            transition: color 0.2s;
        }
        .checkmark:hover {
            color: #879886;
        }
        .answered-halo:hover {
            box-shadow: 0 0 20px 8px rgba(220, 201, 197, 0.4); /* Dusty Rose Glow */
        }
        .verse-box {
            border-color: #dcc9c5; /* Dusty Rose */
        }
        .google-btn {
            background-color: #fff;
            color: #4a4a4a;
            border: 1px solid #dcd9d0;
        }
    </style>
</head>
<body class="antialiased">

    <div id="app-container" class="min-h-screen flex flex-col items-center p-4 sm:p-6 lg:p-8">
        
        <header class="w-full max-w-4xl flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-700">My Prayer Journal</h1>
            <div id="auth-container">
                <button id="login-btn" class="px-4 py-2 rounded-lg btn-secondary">Login</button>
                <button id="signup-btn" class="px-4 py-2 rounded-lg btn-primary">Sign Up</button>
                <div id="user-info" class="hidden items-center">
                    <span id="user-email" class="mr-4 text-gray-600 text-sm"></span>
                    <button id="logout-btn" class="px-4 py-2 rounded-lg btn-secondary">Logout</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="w-full max-w-4xl flex-grow hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Dear Heavenly Father</h2>
                <form id="prayer-form">
                    <textarea id="prayer-input" class="w-full p-4 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#879886] transition" rows="4" placeholder="Write your prayer here..."></textarea>
                    <div class="flex justify-end items-center mt-4">
                         <div id="audio-player" class="mr-auto">
                            <button id="toggle-sound-btn" class="text-gray-400 hover:text-gray-600 hidden">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                            </button>
                        </div>
                        <button type="submit" class="px-6 py-2 rounded-lg font-semibold btn-primary">Amen</button>
                    </div>
                </form>
            </div>

            <nav class="mb-6 border-b border-gray-200">
                <ul class="flex">
                    <li><button data-view="open" class="nav-tab active px-4 py-2 text-lg font-medium border-b-2 border-transparent transition">Current</button></li>
                    <li><button data-view="answered" class="nav-tab px-4 py-2 text-lg font-medium border-b-2 border-transparent transition">Answered</button></li>
                </ul>
            </nav>

            <div id="prayers-view">
                <div id="open-prayers-container">
                    <p id="open-placeholder" class="text-center text-gray-500 py-10 hidden">Your current prayers will appear here.</p>
                    <div id="open-prayers-list" class="space-y-4"></div>
                </div>
                <div id="answered-prayers-container" class="hidden">
                     <p id="answered-placeholder" class="text-center text-gray-500 py-10 hidden">Your answered prayers will appear here.</p>
                    <div id="answered-prayers-list" class="space-y-4"></div>
                </div>
            </div>
        </main>
        
        <div id="welcome-message" class="text-center flex-grow flex flex-col justify-center items-center">
             <h2 class="text-4xl font-bold text-gray-700 mb-4">A Quiet Place for Your Thoughts</h2>
             <p class="text-lg text-gray-500 max-w-md">Please log in or sign up to begin your personal prayer journal.</p>
        </div>

    </div>

    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-sm m-4">
            <h3 id="modal-title" class="text-2xl font-bold text-center mb-6">Login</h3>
            <form id="auth-form">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#879886]" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#879886]" required>
                </div>
                <p id="auth-error" class="text-red-500 text-sm text-center mb-4 h-5"></p>
                <button type="submit" id="modal-submit-btn" class="w-full py-3 rounded-lg font-semibold btn-primary">Login</button>
            </form>
            
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="mx-4 text-gray-500 text-sm">OR</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <button id="google-signin-btn" class="w-full py-3 rounded-lg font-semibold google-btn flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24V28H36.444C35.845 32.748 31.782 35.801 24 35.801C18.156 35.801 13.004 31.547 11.196 25.655H1.674V33.109H11.196C13.435 39.539 19.263 43.593 24 43.593C29.838 43.593 34.78 40.593 37.893 35.801L43.611 40.093C39.697 44.757 32.783 48 24 48C14.07 48 5.233 41.246 1.674 31.11H11.196C13.004 36.33 18.156 40.093 24 40.093C31.782 40.093 35.845 36.639 37.893 31.11L43.611 35.801L43.611 20.083Z"/>
                    <path fill="#FF3D00" d="M11.196 25.655C10.741 24.167 10.508 22.593 10.508 21C10.508 19.407 10.741 17.833 11.196 16.345V8.891H1.674C-1.885 18.254 0.287 31.11 11.196 33.109V25.655Z"/>
                    <path fill="#4CAF50" d="M43.611 20.083C43.834 19.208 43.957 18.254 43.957 17.204C43.957 16.155 43.834 15.201 43.611 14.326V8.891L37.893 13.582C36.721 11.455 35.034 9.616 32.951 8.21L37.893 4.296C41.229 6.275 43.611 10.227 43.611 14.326V20.083Z"/>
                    <path fill="#1976D2" d="M24 8.891C28.431 8.891 32.484 10.825 35.267 14.153L29.549 18.844C27.94 17.478 26.046 16.891 24 16.891C18.156 16.891 13.004 21.145 11.196 27.037V33.109H1.674V25.655C5.233 15.719 14.07 8.891 24 8.891Z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
            <p class="text-center text-sm text-gray-600 mt-6">
                <span id="modal-switch-text">Don't have an account?</span>
                <button id="modal-switch-btn" class="font-semibold text-[#879886] hover:underline">Sign Up</button>
            </p>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            signInWithPopup,
            GoogleAuthProvider,
            signInAnonymously,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            where, 
            onSnapshot,
            orderBy,
            doc,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-prayer-journal';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let prayersUnsubscribe = null;
        let isModalForSignup = false;

        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authContainer = document.getElementById('auth-container');
        const userInfo = document.getElementById('user-info');
        const userEmailSpan = document.getElementById('user-email');
        const mainContent = document.getElementById('main-content');
        const welcomeMessage = document.getElementById('welcome-message');

        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const modalTitle = document.getElementById('modal-title');
        const modalSubmitBtn = document.getElementById('modal-submit-btn');
        const modalSwitchText = document.getElementById('modal-switch-text');
        const modalSwitchBtn = document.getElementById('modal-switch-btn');
        const authError = document.getElementById('auth-error');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const googleSignInBtn = document.getElementById('google-signin-btn');

        const prayerForm = document.getElementById('prayer-form');
        const prayerInput = document.getElementById('prayer-input');
        
        const navTabs = document.querySelectorAll('.nav-tab');
        const openPrayersContainer = document.getElementById('open-prayers-container');
        const answeredPrayersContainer = document.getElementById('answered-prayers-container');
        const openPrayersList = document.getElementById('open-prayers-list');
        const answeredPrayersList = document.getElementById('answered-prayers-list');
        
        const openPlaceholder = document.getElementById('open-placeholder');
        const answeredPlaceholder = document.getElementById('answered-placeholder');

        const setupUIForLoggedIn = (user) => {
            loginBtn.classList.add('hidden');
            signupBtn.classList.add('hidden');
            userInfo.classList.remove('hidden');
            userInfo.classList.add('flex');
            userEmailSpan.textContent = user.email;
            mainContent.classList.remove('hidden');
            welcomeMessage.classList.add('hidden');
        };

        const setupUIForLoggedOut = () => {
            loginBtn.classList.remove('hidden');
            signupBtn.classList.remove('hidden');
            userInfo.classList.add('hidden');
            mainContent.classList.add('hidden');
            welcomeMessage.classList.remove('hidden');
            welcomeMessage.classList.add('flex');
            openPrayersList.innerHTML = '';
            answeredPrayersList.innerHTML = '';
        };

        const openAuthModal = (forSignup) => {
            isModalForSignup = forSignup;
            authError.textContent = '';
            authForm.reset();
            if (isModalForSignup) {
                modalTitle.textContent = 'Sign Up';
                modalSubmitBtn.textContent = 'Sign Up';
                modalSwitchText.textContent = 'Already have an account?';
                modalSwitchBtn.textContent = 'Login';
            } else {
                modalTitle.textContent = 'Login';
                modalSubmitBtn.textContent = 'Login';
                modalSwitchText.textContent = "Don't have an account?";
                modalSwitchBtn.textContent = 'Sign Up';
            }
            authModal.classList.remove('hidden');
            authModal.classList.add('flex');
        };

        const closeAuthModal = () => {
            authModal.classList.add('hidden');
            authModal.classList.remove('flex');
        };

        loginBtn.addEventListener('click', () => openAuthModal(false));
        signupBtn.addEventListener('click', () => openAuthModal(true));
        modalSwitchBtn.addEventListener('click', () => openAuthModal(!isModalForSignup));
        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) {
                closeAuthModal();
            }
        });
        
        googleSignInBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                closeAuthModal();
            } catch (error) {
                console.error("Google Sign-In error:", error);
                authError.textContent = error.message.replace('Firebase: ', '');
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            authError.textContent = '';

            try {
                if (isModalForSignup) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                closeAuthModal();
            } catch (error) {
                console.error("Authentication error:", error);
                authError.textContent = error.message.replace('Firebase: ', '');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        const fetchAndDisplayPrayers = (userId) => {
            if (prayersUnsubscribe) {
                prayersUnsubscribe();
            }
            const prayersCollection = collection(db, 'artifacts', appId, 'users', userId, 'prayers');
            const q = query(prayersCollection, orderBy('timestamp', 'desc'));

            prayersUnsubscribe = onSnapshot(q, (snapshot) => {
                openPrayersList.innerHTML = '';
                answeredPrayersList.innerHTML = '';
                let openCount = 0;
                let answeredCount = 0;

                snapshot.docs.forEach(doc => {
                    const prayer = { id: doc.id, ...doc.data() };
                    const prayerCard = createPrayerCard(prayer);
                    if (prayer.isAnswered) {
                        answeredPrayersList.appendChild(prayerCard);
                        answeredCount++;
                    } else {
                        openPrayersList.appendChild(prayerCard);
                        openCount++;
                    }
                });
                
                openPlaceholder.classList.toggle('hidden', openCount > 0);
                answeredPlaceholder.classList.toggle('hidden', answeredCount > 0);

            }, (error) => {
                console.error("Error fetching prayers:", error);
            });
        };

        const generatePrayerVerse = async (prayerText, prayerId, button) => {
            const prompt = `Please find a single, comforting, and relevant Bible verse from the ESV (English Standard Version) translation for the following prayer. Only provide the verse reference and the verse text, without any additional commentary. The prayer is: "${prayerText}"`;
            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            const apiKey = "" 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            button.disabled = true;
            button.innerHTML = '...';

            let verseText = '';
            let retries = 0;
            const maxRetries = 5;
            let delay = 1000;

            while (retries < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        throw new Error(`API call failed: ${response.status}`);
                    }
                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        verseText = result.candidates[0].content.parts[0].text;
                        break;
                    } else {
                        throw new Error('Invalid API response structure');
                    }
                } catch (error) {
                    retries++;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }

            if (verseText) {
                const prayerRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'prayers', prayerId);
                try {
                    await updateDoc(prayerRef, { bibleVerse: verseText });
                } catch (error) {
                    console.error("Error updating prayer with verse:", error);
                }
            }
            button.disabled = false;
        };

        const createPrayerCard = (prayer) => {
            const card = document.createElement('div');
            card.className = 'prayer-card bg-white p-5 rounded-lg shadow-sm border border-gray-100';
            card.dataset.id = prayer.id;
            
            if (prayer.isAnswered) {
                card.classList.add('answered-halo');
            }

            const date = prayer.timestamp?.toDate().toLocaleString() || new Date().toLocaleString();
            
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <p class="text-gray-800 whitespace-pre-wrap flex-1">${prayer.text}</p>
                    <div class="flex-shrink-0 flex items-center ml-4 space-x-2">
                        ${!prayer.isAnswered && !prayer.bibleVerse ? `
                            <button class="get-verse-btn text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-500 font-semibold hover:bg-slate-200 transition">Get a Verse 📖</button>
                        ` : ''}
                        ${!prayer.isAnswered ? `
                            <button data-id="${prayer.id}" class="mark-answered-btn" title="Mark as Answered">
                                <svg class="w-8 h-8 checkmark" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </button>
                        ` : ''}
                    </div>
                </div>
                ${prayer.bibleVerse ? `
                    <div class="mt-4 p-3 bg-gray-50 border-l-4 border-l-[#dcc9c5] rounded-lg text-sm text-gray-700 verse-box">
                        <p>${prayer.bibleVerse}</p>
                    </div>
                ` : ''}
                <p class="text-xs text-gray-400 mt-3 text-right">${date}</p>
            `;

            if (!prayer.isAnswered) {
                const markBtn = card.querySelector('.mark-answered-btn');
                if (markBtn) {
                    markBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const prayerId = markBtn.dataset.id;
                        card.classList.add('removing');
                        await markPrayerAsAnswered(prayerId);
                    });
                }

                const verseBtn = card.querySelector('.get-verse-btn');
                if (verseBtn) {
                    verseBtn.addEventListener('click', () => {
                        generatePrayerVerse(prayer.text, prayer.id, verseBtn);
                    });
                }
            }

            return card;
        };
        
        const markPrayerAsAnswered = async (prayerId) => {
            if (!currentUserId) return;
            const prayerRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'prayers', prayerId);
            try {
                await updateDoc(prayerRef, { isAnswered: true });
            } catch (error) {
                console.error("Error updating prayer:", error);
            }
        };

        prayerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prayerText = prayerInput.value.trim();
            if (prayerText && currentUserId) {
                try {
                    const prayersCollection = collection(db, 'artifacts', appId, 'users', currentUserId, 'prayers');
                    await addDoc(prayersCollection, {
                        text: prayerText,
                        timestamp: serverTimestamp(),
                        isAnswered: false
                    });
                    prayerInput.value = '';
                    prayerInput.classList.remove('form-glow');
                } catch (error) {
                    console.error("Error adding prayer:", error);
                }
            }
        });
        
        prayerInput.addEventListener('focus', () => prayerInput.classList.add('form-glow'));
        prayerInput.addEventListener('blur', () => prayerInput.classList.remove('form-glow'));

        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const view = tab.dataset.view;
                navTabs.forEach(t => {
                    t.classList.remove('active');
                    t.classList.remove('font-bold');
                    t.classList.remove('text-[#879886]');
                });
                tab.classList.add('active');
                tab.classList.add('font-bold');
                tab.classList.add('text-[#879886]');

                if (view === 'open') {
                    openPrayersContainer.classList.remove('hidden');
                    answeredPrayersContainer.classList.add('hidden');
                } else {
                    openPrayersContainer.classList.add('hidden');
                    answeredPrayersContainer.classList.remove('hidden');
                }
            });
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUserId = user.uid;
                setupUIForLoggedIn(user);
                fetchAndDisplayPrayers(currentUserId);
            } else {
                currentUserId = null;
                if (prayersUnsubscribe) {
                    prayersUnsubscribe();
                }
                setupUIForLoggedOut();
            }
        });
        
        async function handleInitialAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // Fallback to anonymous sign-in if no custom token is available
                    await signInAnonymously(auth);
                }
            } catch(error) {
                console.error("Initial authentication failed:", error);
                if (error.code === 'auth/operation-not-allowed') {
                     console.log("Anonymous sign-in not enabled. User must sign in manually.");
                }
            }
        }
        
        // This is a crucial step to authorize the domain for Google Sign-In.
        // If you are hosting this on a new domain, you must add it to the list of authorized domains in your Firebase project.
        // 1. Go to your Firebase project console.
        // 2. Navigate to "Authentication" in the Build menu.
